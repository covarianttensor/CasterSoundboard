name: Build Packages & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 and multimedia dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            ffmpeg \
            libfuse2t64 \
            libgl1-mesa-dev \
            qmake6 \
            qt6-base-dev \
            qt6-multimedia-dev \
            qt6-wayland \
            qt6-wayland-dev

      - name: Build AppImage
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasterSoundboard-x86_64.AppImage
          path: CasterSoundboard*.AppImage

      - name: Attach AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CasterSoundboard*.AppImage

  flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: CasterSoundboard.flatpak
          manifest-path: io.github.covarianttensor.CasterSoundboard.yml
          cache: false

      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasterSoundboard.flatpak
          path: CasterSoundboard.flatpak

      - name: Attach Flatpak bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CasterSoundboard.flatpak
