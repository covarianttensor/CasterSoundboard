name: Build Packages & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            curl \
            file \
            ffmpeg \
            libfuse2t64 \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates \
            qml6-module-qtmultimedia \
            qt6-multimedia-dev \
            qt6-wayland \
            qt6-wayland-dev

      - name: Build AppImage
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appimage-bundle
          path: CasterSoundboard-*.AppImage

  flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate VERSION metadata file
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${VERSION}" ] || [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            VERSION="$(git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' || echo "2.1.1-dev")"
          fi
          echo "${VERSION}" > VERSION

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: CasterSoundboard.flatpak
          manifest-path: io.github.covarianttensor.CasterSoundboard.yml
          cache: false

      - name: Create Versioned Flatpak Bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -n "${VERSION}" ]; then
            mv -f CasterSoundboard.flatpak "CasterSoundboard-${VERSION}-x86_64.flatpak"
          else
            mv -f CasterSoundboard.flatpak "CasterSoundboard-x86_64.flatpak"
          fi

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: CasterSoundboard-*.flatpak

  deb:
    name: Build Debian Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            file \
            dpkg-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates \
            qml6-module-qtmultimedia \
            qt6-multimedia-dev

      - name: Build Debian Package
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Upload Debian Package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-bundle
          path: castersoundboard_*.deb

  rpm:
    name: Build RPM Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            file \
            rpm \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates \
            qml6-module-qtmultimedia \
            qt6-multimedia-dev

      - name: Build RPM Package
        run: |
          chmod +x scripts/build-rpm.sh
          ./scripts/build-rpm.sh

      - name: Upload RPM Package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-bundle
          path: castersoundboard-*.rpm

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, flatpak, deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          name: appimage-bundle
          path: release-assets

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
          path: release-assets

      - name: Download Debian artifacts
        uses: actions/download-artifact@v4
        with:
          name: deb-bundle
          path: release-assets

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpm-bundle
          path: release-assets

      - name: List Release Assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

