name: Feature Request
description: Suggest an enhancement or new feature for Caster Soundboard
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! Please check [existing issues](https://github.com/covarianttensor/CasterSoundboard/issues) to see if this has already been proposed.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a specific workflow problem or limitation?
      placeholder: "e.g. I frequently need to route soundboard audio to two separate output devices simultaneously..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: Describe what you would like to see added or changed and how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any workarounds or alternative approaches?
  - type: textarea
    id: context
    attributes:
      label: Additional Context & Mockups
      description: Attach any mockups, screenshots, or examples from other software that might help illustrate your request.
