<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Caster Soundboard Web Remote</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <style>
    :root {
      --bg-color: #121416;
      --card-bg: #1E2226;
      --border-color: #33383E;
      --text-main: #FFFFFF;
      --text-muted: #8E96A0;
      --accent: #8E2DE2;
      --accent-hover: #A855F7;
      --playing-color: #10B981;
      --paused-color: #F59E0B;
      --stop-all: #EF4444;
      --duck-color: #F97316;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 24px;
    }

    /* --- TOP BAR --- */
    header {
      background-color: #1A1D20;
      border-bottom: 1px solid var(--border-color);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #8E2DE2, #4A00E0);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: #fff;
    }

    .brand-title {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.3px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      background-color: #262B30;
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #EF4444;
    }

    .status-dot.connected {
      background-color: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .status-dot.reconnecting {
      background-color: #F59E0B;
      animation: pulse 1.2s infinite;
    }

    .ptt-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      background-color: #064E3B;
      color: #A7F3D0;
      border: 1px solid #10B981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.45);
      animation: pttGlowPulse 1.2s infinite alternate;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
    }

    .ptt-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.85);
    }

    @keyframes pttGlowPulse {
      0% {
        box-shadow: 0 0 6px rgba(16, 185, 129, 0.3);
        border-color: #059669;
      }
      100% {
        box-shadow: 0 0 14px rgba(16, 185, 129, 0.85);
        border-color: #34D399;
      }
    }

    .global-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-duck {
      background-color: #2C261E;
      color: #FDBA74;
      border-color: #523D26;
    }

    .btn-duck.active {
      background-color: var(--duck-color);
      color: #FFFFFF;
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.4);
    }

    .btn-stop-all {
      background-color: var(--stop-all);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3);
    }

    .btn-stop-all:active, .action-btn:active {
      transform: scale(0.96);
    }

    /* --- TAB NAVIGATION BAR --- */
    .tab-bar-container {
      padding: 12px 18px 4px 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-bar-container::-webkit-scrollbar {
      display: none;
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      min-width: max-content;
    }

    .tab-pill {
      background-color: #22262B;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .tab-pill * {
      pointer-events: none;
    }

    .tab-pill.active {
      background-color: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent-hover);
      box-shadow: 0 2px 8px rgba(142, 45, 226, 0.35);
    }

    .tab-hotkey-badge {
      background-color: rgba(0, 0, 0, 0.25);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-family: monospace;
    }

    .tab-pill.transmitting {
      background-color: #064E3B !important;
      color: #A7F3D0 !important;
      border-color: #10B981 !important;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6) !important;
      animation: pttGlowPulse 1.2s infinite alternate;
    }

    .tab-action-badge {
      background-color: rgba(142, 45, 226, 0.25);
      color: #D8B4FE;
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      margin-left: 4px;
      transition: all 0.15s ease;
    }

    .tab-action-badge.transmitting {
      background-color: #064E3B;
      color: #6EE7B7;
      border-color: #10B981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
    }

    /* --- SOUND TILE GRID --- */
    main {
      padding: 14px 18px;
      flex: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
    }

    .tile-btn {
      position: relative;
      height: 120px;
      border-radius: 10px;
      border: 2px solid #3A4048;
      background-color: var(--tile-bg, #22262B);
      color: var(--tile-text, #FFFFFF);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.1s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      text-align: left;
      touch-action: manipulation;
      -webkit-touch-callout: none;
    }

    .tile-btn * {
      pointer-events: none;
    }

    .tile-btn:active {
      transform: scale(0.96);
    }

    .tile-btn.empty {
      opacity: 0.35;
      cursor: default;
      border-style: dashed;
    }

    .tile-btn.playing {
      border-color: var(--playing-color) !important;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.55), inset 0 0 10px rgba(16, 185, 129, 0.25);
      animation: glowPulse 1.8s infinite alternate;
    }

    .tile-btn.paused {
      border-color: var(--paused-color) !important;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
    }

    .tile-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
    }

    .tile-hotkey {
      background-color: rgba(0, 0, 0, 0.4);
      color: #FFFFFF;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      font-family: monospace;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .tile-state-tag {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .tile-state-tag.playing {
      background-color: var(--playing-color);
      color: #000;
    }

    .tile-state-tag.paused {
      background-color: var(--paused-color);
      color: #000;
    }

    .tile-btn.transmitting {
      border-color: #10B981 !important;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.75), inset 0 0 12px rgba(16, 185, 129, 0.35) !important;
    }

    .tile-ptt-tag {
      background-color: #064E3B;
      color: #6EE7B7;
      border: 1px solid #10B981;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.3px;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.4);
      animation: pttGlowPulse 1.2s infinite alternate;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .tile-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tile-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      opacity: 0.85;
      font-weight: 600;
    }

    /* --- FOOTER INFO --- */
    .keyboard-hint {
      text-align: center;
      padding: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .keyboard-hint kbd {
      background-color: #22262B;
      border: 1px solid #3E454E;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      color: #D1D5DB;
    }

    @keyframes glowPulse {
      from { box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
      to { box-shadow: 0 0 18px rgba(16, 185, 129, 0.85); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-title">Caster Remote</div>
      <div class="status-badge">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Connecting…</span>
      </div>
      <div id="pttBadge" class="ptt-badge" style="display: none;">
        <span class="ptt-dot"></span>
        <span id="pttText">PTT ACTIVE</span>
      </div>
    </div>

    <div class="global-actions">
      <button id="duckBtn" class="action-btn btn-duck" title="Toggle Audio Ducking (D)">
        🦆 Ducking
      </button>
      <button id="stopAllBtn" class="action-btn btn-stop-all" title="Panic: Stop All Sounds (Space)">
        ⏹ Stop All
      </button>
    </div>
  </header>

  <!-- TAB SELECTION -->
  <div class="tab-bar-container">
    <div id="tabBar" class="tab-bar"></div>
  </div>

  <!-- SOUND TILE GRID -->
  <main>
    <div id="tileGrid" class="grid"></div>
  </main>

  <div class="keyboard-hint">
    Tip: Press <kbd>Space</kbd> for Stop All &bull; <kbd>D</kbd> for Ducking &bull; Physical keys trigger assigned sound tiles
  </div>

  <script>
    let appState = null;
    let lastSerializedState = '';
    let selectedTabIndex = 0;
    let eventSource = null;
    let pollTimer = null;
    let isFetching = false;
    let sseActive = false;

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const pttBadge = document.getElementById('pttBadge');
    const pttText = document.getElementById('pttText');
    const tabBar = document.getElementById('tabBar');
    const tileGrid = document.getElementById('tileGrid');
    const duckBtn = document.getElementById('duckBtn');
    const stopAllBtn = document.getElementById('stopAllBtn');

    function formatKey(rawKey) {
      if (!rawKey) return '';
      if (rawKey.startsWith('KEY_')) {
        const sub = rawKey.substring(4);
        if (sub === 'SPACE') return 'Space';
        if (sub === 'DOT') return '.';
        if (sub === 'COMMA') return ',';
        if (sub === 'LEFTCTRL') return 'Ctrl';
        if (sub === 'LEFTSHIFT') return 'Shift';
        if (sub === 'LEFTALT') return 'Alt';
        return sub;
      }
      return rawKey;
    }

    const optimisticTxKeys = new Set();

    function getActionKeyFromBadge(badge) {
      if (!badge) return '';
      const colonIdx = badge.indexOf(':');
      if (colonIdx !== -1) {
        return badge.substring(colonIdx + 1).trim();
      }
      return '';
    }

    function recordOptimisticActionTrigger(tabIdx) {
      if (!appState || !appState.tabs || !appState.tabs[tabIdx]) return;
      const tab = appState.tabs[tabIdx];
      const actionKey = getActionKeyFromBadge(tab.actionBadge);
      if (actionKey) {
        const lower = actionKey.toLowerCase();
        optimisticTxKeys.add(lower);
        setTimeout(() => {
          optimisticTxKeys.delete(lower);
        }, 1500);
      }
    }

    function isEventKeyTransmitting(e) {
      const eKey = (e.key || '').toLowerCase();
      const eCode = (e.code || '').toLowerCase();

      // 1. Check optimistic transmitting keys from recent clicks/triggers
      if (optimisticTxKeys.has(eKey)) return true;
      if (eCode.startsWith('key') && optimisticTxKeys.has(eCode.substring(3))) return true;
      if (optimisticTxKeys.has('space') && (eKey === ' ' || eCode === 'space')) return true;

      // 2. Check active transmitting keys reported by server
      const txKeys = (appState && appState.transmittingKeys) ? appState.transmittingKeys :
                     (appState && appState.activeTransmittingKey ? [appState.activeTransmittingKey] : []);

      for (const rawKey of txKeys) {
        if (!rawKey) continue;
        const formatted = formatKey(rawKey).toLowerCase();
        const codeSuffix = rawKey.startsWith('KEY_') ? rawKey.substring(4).toLowerCase() : rawKey.toLowerCase();

        if (eKey === formatted || eKey === codeSuffix) return true;
        if (eCode === ('key' + codeSuffix) || eCode === codeSuffix) return true;
        if (formatted === 'space' && (eCode === 'space' || eKey === ' ')) return true;
      }

      // 3. Check if any currently transmitting tab has this action key
      if (appState && appState.tabs) {
        for (const tab of appState.tabs) {
          if (tab.isTransmitting && tab.actionBadge) {
            const actionKey = getActionKeyFromBadge(tab.actionBadge).toLowerCase();
            if (actionKey && (eKey === actionKey || eCode === ('key' + actionKey))) return true;
            if (actionKey === 'space' && (eKey === ' ' || eCode === 'space')) return true;
          }
        }
      }

      return false;
    }

    // Dynamic black/white text contrast calculation
    function getContrastTextColor(hex) {
      if (!hex || !/^#[0-9A-Fa-f]{6}$/.test(hex)) return '#FFFFFF';
      const r = parseInt(hex.substr(1, 2), 16) / 255;
      const g = parseInt(hex.substr(3, 2), 16) / 255;
      const b = parseInt(hex.substr(5, 2), 16) / 255;
      const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      return luminance > 0.45 ? '#0A0A0A' : '#FFFFFF';
    }

    function setConnectionStatus(connected, mode) {
      if (connected) {
        statusDot.className = 'status-dot connected';
        statusText.textContent = mode ? `Live (${mode})` : 'Connected';
      } else {
        statusDot.className = 'status-dot reconnecting';
        statusText.textContent = mode || 'Connecting…';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // API Post Request Helper with X-Caster-Remote Header & immediate AJAX sync
    async function apiPost(endpoint) {
      try {
        const resp = await fetch(endpoint, {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            'X-Caster-Remote': '1'
          }
        });
        if (!resp.ok && resp.status !== 204) {
          console.warn('API call error:', resp.status);
        }
        // Immediate AJAX state fetch after user interaction
        await fetchState();
      } catch (err) {
        console.error('Network request failed:', err);
      }
    }

    // AJAX State Fetcher
    async function fetchState() {
      if (isFetching) return;
      isFetching = true;
      try {
        const resp = await fetch('/api/state?_t=' + Date.now(), {
          method: 'GET',
          credentials: 'same-origin',
          cache: 'no-store'
        });
        if (resp.ok) {
          const data = await resp.json();
          applyState(data);
          if (!sseActive) {
            setConnectionStatus(true, 'AJAX');
          }
        } else if (resp.status === 401) {
          setConnectionStatus(false, 'Auth Required');
        } else {
          setConnectionStatus(false, 'Error ' + resp.status);
        }
      } catch (err) {
        if (!sseActive) {
          setConnectionStatus(false, 'Offline');
        }
      } finally {
        isFetching = false;
      }
    }

    // Connect to Server-Sent Events (SSE)
    function initEvents() {
      if (eventSource) {
        eventSource.close();
      }

      try {
        eventSource = new EventSource('/events');

        eventSource.onopen = () => {
          sseActive = true;
          setConnectionStatus(true, 'SSE');
        };

        eventSource.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            applyState(data);
            sseActive = true;
            setConnectionStatus(true, 'SSE');
          } catch (e) {
            console.error('Failed to parse SSE payload:', e);
          }
        };

        eventSource.onerror = () => {
          sseActive = false;
          // When SSE drops, AJAX polling continues seamlessly
          fetchState();
        };
      } catch (e) {
        console.warn('SSE not supported or failed to initialize:', e);
        sseActive = false;
      }
    }

    // Start background AJAX polling loop
    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      const interval = document.hidden ? 1200 : 300;
      pollTimer = setInterval(fetchState, interval);
    }

    document.addEventListener('visibilitychange', () => {
      startPolling();
      if (!document.hidden) {
        fetchState();
      }
    });

    // Smart DOM update using state diffing
    function applyState(data) {
      if (!data || !data.tabs) return;

      const serialized = JSON.stringify(data);
      if (serialized === lastSerializedState && data.activeTabIndex === selectedTabIndex) {
        return;
      }
      lastSerializedState = serialized;
      appState = data;

      // Sync active tab with desktop app
      if (typeof appState.activeTabIndex === 'number' &&
          appState.activeTabIndex >= 0 &&
          appState.activeTabIndex < appState.tabs.length) {
        selectedTabIndex = appState.activeTabIndex;
      } else if (selectedTabIndex >= appState.tabs.length) {
        selectedTabIndex = Math.max(0, appState.tabs.length - 1);
      }

      render();
    }

    // Render Full UI with smart DOM reconciliation
    function render() {
      if (!appState || !appState.tabs) return;

      // 1. Ducking State
      const isDucking = !!appState.isDuckingActive;
      if (duckBtn.classList.contains('active') !== isDucking) {
        duckBtn.classList.toggle('active', isDucking);
        duckBtn.textContent = isDucking ? '🦆 Ducked' : '🦆 Ducking';
      }

      // 1b. PTT Active State
      const isPttActive = !!appState.isPttActive;
      if (pttBadge) {
        if (isPttActive) {
          pttBadge.style.display = 'inline-flex';
          const rawKey = appState.activeTransmittingKey || '';
          const keyLabel = formatKey(rawKey);
          pttText.textContent = keyLabel ? `PTT ACTIVE (${keyLabel})` : 'PTT ACTIVE';
        } else {
          pttBadge.style.display = 'none';
        }
      }

      // 2. Render Tabs
      const currentTabCount = tabBar.children.length;
      const needsTabRebuild = currentTabCount !== appState.tabs.length ||
        Array.from(tabBar.children).some((pill, idx) => {
          const tab = appState.tabs[idx];
          return !tab || pill.dataset.tabId !== String(tab.id) ||
                 pill.dataset.isTransmitting !== String(!!tab.isTransmitting) ||
                 pill.dataset.actionBadge !== String(tab.actionBadge || '');
        });

      if (needsTabRebuild) {
        tabBar.innerHTML = '';
        appState.tabs.forEach((tab, idx) => {
          const pill = document.createElement('button');
          const isTx = !!tab.isTransmitting;
          pill.className = 'tab-pill' + (idx === selectedTabIndex ? ' active' : '') + (isTx ? ' transmitting' : '');
          pill.dataset.tabId = String(tab.id || idx);
          pill.dataset.tabIndex = String(idx);
          pill.dataset.isTransmitting = String(isTx);
          pill.dataset.actionBadge = String(tab.actionBadge || '');

          let actionBadgeHtml = '';
          if (isTx) {
            actionBadgeHtml = `<span class="tab-action-badge transmitting">🟢 PTT</span>`;
          } else if (tab.actionBadge) {
            actionBadgeHtml = `<span class="tab-action-badge">🎙️ ${escapeHtml(tab.actionBadge)}</span>`;
          }

          pill.innerHTML = `<span>${escapeHtml(tab.name || ('Tab ' + (idx + 1)))}</span>` +
                           (tab.hotkey ? `<span class="tab-hotkey-badge">${escapeHtml(tab.hotkey)}</span>` : '') +
                           actionBadgeHtml;
          tabBar.appendChild(pill);
        });
      } else {
        Array.from(tabBar.children).forEach((pill, idx) => {
          const tab = appState.tabs[idx];
          const isTx = tab ? !!tab.isTransmitting : false;
          pill.dataset.tabIndex = String(idx);
          pill.classList.toggle('active', idx === selectedTabIndex);
          pill.classList.toggle('transmitting', isTx);
        });
      }

      // 3. Render Sound Tiles
      const currentTab = appState.tabs[selectedTabIndex] || appState.tabs[0];
      if (!currentTab || !currentTab.tiles) return;

      const tiles = currentTab.tiles;
      const currentTileCount = tileGrid.children.length;
      const currentGridTabId = tileGrid.dataset.tabId;
      const activeTabId = String(currentTab.id || selectedTabIndex);

      const needsGridRebuild = currentGridTabId !== activeTabId || currentTileCount !== tiles.length;

      if (needsGridRebuild) {
        tileGrid.innerHTML = '';
        tileGrid.dataset.tabId = activeTabId;

        tiles.forEach((tile) => {
          const btn = document.createElement('button');
          updateTileButton(btn, tile);
          tileGrid.appendChild(btn);
        });
      } else {
        // Targeted in-place tile update
        Array.from(tileGrid.children).forEach((btn, idx) => {
          const tile = tiles[idx];
          if (tile) {
            updateTileButton(btn, tile);
          }
        });
      }
    }

    // Helper to update a single tile button element efficiently
    function updateTileButton(btn, tile) {
      const tileIndex = String(tile.index !== undefined ? tile.index : '');
      const hasFile = !!tile.hasFile;
      const state = (tile.state || 'Stopped').toLowerCase();
      const tileColor = (hasFile && tile.color && tile.color !== '#000000') ? tile.color : '#25292E';
      const textColor = getContrastTextColor(tileColor);
      const name = tile.name || (hasFile ? 'Untitled Sound' : 'Empty Slot');
      const hotkey = tile.hotkey || '';
      const isLooped = !!tile.isLooped;
      const isTransmitting = !!tile.isTransmitting;

      // Check if anything changed on this button
      const oldIndex = btn.dataset.tileIndex;
      const oldState = btn.dataset.state;
      const oldHasFile = btn.dataset.hasFile;
      const oldColor = btn.dataset.color;
      const oldName = btn.dataset.name;
      const oldHotkey = btn.dataset.hotkey;
      const oldLooped = btn.dataset.isLooped;
      const oldTransmitting = btn.dataset.isTransmitting;

      if (oldIndex === tileIndex && oldState === state && oldHasFile === String(hasFile) &&
          oldColor === tileColor && oldName === name &&
          oldHotkey === hotkey && oldLooped === String(isLooped) &&
          oldTransmitting === String(isTransmitting)) {
        return; // No changes on this tile
      }

      btn.dataset.tileIndex = tileIndex;
      btn.dataset.state = state;
      btn.dataset.hasFile = String(hasFile);
      btn.dataset.color = tileColor;
      btn.dataset.name = name;
      btn.dataset.hotkey = hotkey;
      btn.dataset.isLooped = String(isLooped);
      btn.dataset.isTransmitting = String(isTransmitting);

      btn.className = 'tile-btn ' + state + (hasFile ? '' : ' empty') + (isTransmitting ? ' transmitting' : '');
      btn.style.setProperty('--tile-bg', tileColor);
      btn.style.setProperty('--tile-text', textColor);

      let stateBadgeHtml = '';
      if (state === 'playing') {
        stateBadgeHtml = '<span class="tile-state-tag playing">PLAYING</span>';
      } else if (state === 'paused') {
        stateBadgeHtml = '<span class="tile-state-tag paused">PAUSED</span>';
      }

      btn.innerHTML = `
        <div class="tile-header">
          <div style="display: flex; align-items: center; gap: 4px;">
            ${hotkey ? `<span class="tile-hotkey">${escapeHtml(hotkey)}</span>` : '<span></span>'}
            ${isTransmitting ? `<span class="tile-ptt-tag">🎙️ PTT</span>` : ''}
          </div>
          ${stateBadgeHtml}
        </div>
        <div class="tile-title">${escapeHtml(name)}</div>
        <div class="tile-footer">
          <span>${isLooped ? '🔁 Loop' : ''}</span>
          <span>${hasFile ? (state === 'playing' ? '▶' : (state === 'paused' ? '⏸' : '')) : ''}</span>
        </div>
      `;
    }

    // Event Delegation for Sound Tile Grid (robust against DOM reuse & mobile touch taps)
    tileGrid.addEventListener('click', async (e) => {
      const btn = e.target.closest('.tile-btn');
      if (!btn) return;
      if (btn.dataset.hasFile !== 'true') return;
      const tileIdx = btn.dataset.tileIndex;
      if (tileIdx === undefined || tileIdx === null) return;
      recordOptimisticActionTrigger(selectedTabIndex);
      await apiPost(`/api/toggle/${selectedTabIndex}/${tileIdx}`);
    });

    // Event Delegation for Tab Bar Navigation
    tabBar.addEventListener('click', async (e) => {
      const pill = e.target.closest('.tab-pill');
      if (!pill) return;
      const tabIdx = parseInt(pill.dataset.tabIndex, 10);
      if (isNaN(tabIdx)) return;
      selectedTabIndex = tabIdx;
      await apiPost('/api/tab/' + tabIdx);
    });

    // Global Action Button Handlers
    stopAllBtn.onclick = () => apiPost('/api/stopAll');
    duckBtn.onclick = () => apiPost('/api/duck');

    // Keyboard Shortcuts inside Browser
    window.addEventListener('keydown', (e) => {
      // Ignore if typing inside input
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      // Ignore OS key repeats (especially from virtual key injection holding keys down)
      if (e.repeat) return;

      // Ignore synthetic keystrokes matching actively transmitting PTT/Mute actions to prevent feedback loops
      if (isEventKeyTransmitting(e)) {
        return;
      }

      const key = e.key;

      if (key === ' ' || e.code === 'Space') {
        e.preventDefault();
        apiPost('/api/stopAll');
        return;
      }

      if (key === 'd' || key === 'D') {
        e.preventDefault();
        apiPost('/api/duck');
        return;
      }

      // Check number keys 1-9 for tabs
      if (!isNaN(parseInt(key)) && parseInt(key) >= 1 && parseInt(key) <= 9) {
        const num = parseInt(key);
        if (e.altKey && appState && appState.tabs && num <= appState.tabs.length) {
          selectedTabIndex = num - 1;
          apiPost('/api/tab/' + (num - 1));
          return;
        }
      }

      // Check tile hotkeys on active tab
      if (appState && appState.tabs && appState.tabs[selectedTabIndex]) {
        const tiles = appState.tabs[selectedTabIndex].tiles;
        for (const tile of tiles) {
          if (tile.hasFile && tile.hotkey && tile.hotkey.toLowerCase() === key.toLowerCase()) {
            e.preventDefault();
            recordOptimisticActionTrigger(selectedTabIndex);
            apiPost(`/api/toggle/${selectedTabIndex}/${tile.index}`);
            return;
          }
        }
      }
    });

    // Start background sync
    fetchState();
    startPolling();
    initEvents();
  </script>
</body>
</html>
