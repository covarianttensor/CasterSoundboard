app-id: io.github.covarianttensor.CasterSoundboard
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: CasterSoundboard

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=host
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: castersoundboard
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: .
