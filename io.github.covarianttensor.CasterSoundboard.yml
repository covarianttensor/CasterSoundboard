app-id: io.github.covarianttensor.CasterSoundboard
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: CasterSoundboard

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=host

modules:
  - name: castersoundboard
    buildsystem: qmake
    subdir: CasterSoundboard
    config-opts:
      - PREFIX=/app
    sources:
      - type: dir
        path: .
